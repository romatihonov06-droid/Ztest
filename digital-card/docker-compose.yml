services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: card_user
      POSTGRES_PASSWORD: card_pass
      POSTGRES_DB: digital_card
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_user -d digital_card"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://card_user:card_pass@db:5432/digital_card
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pg_data:
